toolkit.fieldChange.title=Field-Change-Analyse
toolkit.fieldChange.description=Automatisierte Anforderungsanalyse auf Basis von Felddefinitionen und \u00c4nderungshistorie.
toolkit.codeReview.title=Code Review
toolkit.codeReview.description=Statische Analyse mit 250+ SAP-spezifischen Pr\u00fcfregeln f\u00fcr ABAP, CDS und Fiori.
toolkit.rapGenerator.title=RAP/Fiori-Generator
