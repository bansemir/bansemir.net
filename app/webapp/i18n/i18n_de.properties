toolkit.jouleEnablement.title=SAP Joule & BTP-AI Enablement
toolkit.jouleEnablement.description=Erzeugt aus einem Joule-Use-Case und bestehender On-Premise-Landschaft einen vollst\u00e4ndigen Enablement-Blueprint: Zieloperating-Modell, IAS/IPS-Identity, Cloud-Connector- und Destination-Design, Joule-Studio-Skills, Governance und AI-Unit-Absch\u00e4tzung.
toolkit.result=Erfahrungswert: ca. 30\u201350% schnellere Entwicklungszyklen bei h\u00f6herer Qualit\u00e4t.
toolkit.cta=Interessiert? Sprechen wir dar\u00fcber.
toolkit.comingSoon=Bald: Testen Sie den Code Review selbst.
toolkit.motivation.title=Die Ausgangsfrage
toolkit.motivation.text=<p>Am Anfang stand eine praktische Frage: Wie baue ich mit KI Anwendungen, die ich im Arbeitsalltag wirklich einsetze \u2014 keine Demos, sondern Werkzeuge, die einem echten Kundenprojekt standhalten und sich unter realen Bedingungen testen lassen?</p><p>Daraus folgte die zweite Frage: Was daran ist ein Wettbewerbsvorteil? Nicht der Zugang zu einem Modell \u2014 den hat jeder. Sondern das, was hineinflie\u00dft: zw\u00f6lf Jahre SAP-Projekterfahrung, in Regeln gegossen, die sonst nur in den K\u00f6pfen einzelner Berater existieren. Ein Werkzeug, das diese Erfahrung bei jeder Anfrage anwendet, statt sie jedes Mal neu zu erz\u00e4hlen.</p><p>Und die dritte, die \u00fcber den Einsatz beim Kunden entscheidet: Wie nutze ich KI, ohne dauerhafte Fixkosten zu erzeugen? Ein Werkzeug, das pro Aufruf Token verbrennt, rechnet sich in der Breite nicht \u2014 und ist in vielen Landschaften gar nicht genehmigungsf\u00e4hig. Die KI steckt deshalb im Bauen, nicht im Betrieb: entwickelt mit Claude Code, ausgeliefert als deterministische Anwendung ohne einen einzigen Modellaufruf zur Laufzeit. Einmal gebaut, unbegrenzt nutzbar, zu laufenden Kosten von null.</p>
toolkit.concept.title=Warum regelbasiert und nicht einfach ein LLM
toolkit.concept.text=<p>Die meisten AI-Werkzeuge f\u00fcr SAP sind LLM-Wrapper: Prompt rein, Antwort raus. Sobald Nachvollziehbarkeit z\u00e4hlt, tr\u00e4gt das nicht \u2014 dieselbe Eingabe liefert beim zweiten Lauf ein anderes Ergebnis, und niemand kann begr\u00fcnden, warum.</p><p>Das Toolkit dreht das um: Jede Anwendung arbeitet mit statischen SAP-Fachregeln und score-basierter Klassifikation. Gleiche Eingabe, gleiches Ergebnis, jederzeit reproduzierbar. Kein LLM zur Laufzeit, keine externen Aufrufe \u2014 weder Code noch Fachdaten verlassen die Umgebung. Das ist der Unterschied zwischen einem Werkzeug, das man im Kundenprojekt einsetzen kann, und einem, das man vorf\u00fchrt.</p>
toolkit.architecture.title=Wie es funktioniert
toolkit.architecture.text=<p>Alle sechs Anwendungen teilen dieselbe Architektur: eine <strong>Regel-Schicht</strong> aus versionierten SAP-Fachregeln, jede mit ID, Schweregrad und Begr\u00fcndung; eine <strong>Engine-Schicht</strong>, die Eingaben klassifiziert, bewertet und gegen diese Regeln pr\u00fcft; eine <strong>Formatter-Schicht</strong>, die strukturiertes JSON und lesbares Markdown erzeugt.</p><p>Wo es belegbar ist, tr\u00e4gt eine Regel die Referenz auf die SAP-Dokumentation mit. Was das Werkzeug behauptet, l\u00e4sst sich nachschlagen. Abgesichert wird das durch die Testsuiten \u2014 auf jede Fachregel kommen mehrere Testf\u00e4lle. Python und FastAPI, jede App eigenst\u00e4ndig lauff\u00e4hig, Datenbank optional.</p>
toolkit.labelFunction=Was es macht
toolkit.labelBenefit=Nutzen
toolkit.fieldChange.function=Nimmt eine Feldanforderung wie \u201eFeld X in App Y erg\u00e4nzen\u201c und erzeugt daraus einen technischen L\u00f6sungsentwurf: Klassifikation des \u00c4nderungstyps (13 Typen), Impact-Analyse \u00fcber neun SAP-Schichten von der Tabelle \u00fcber CDS, BOPF/RAP und OData bis ins UI, dazu Risikobewertung und Testf\u00e4lle.
toolkit.fieldChange.benefit=Die Frage \u201ewas h\u00e4ngt da eigentlich alles dran?\u201c wird nicht mehr aus dem Ged\u00e4chtnis beantwortet. Statt einen Entwurf zu schreiben, pr\u00fcft man einen \u2014 und sieht sofort, welche Schicht man sonst \u00fcbersehen h\u00e4tte.
toolkit.codeReview.function=Automatisiertes Review f\u00fcr ABAP, CDS Views, RAP Behavior Definitions, UI5-XML-Views und Controller. \u00dcber 250 Regeln in 21 Modulen: Deprecation-Erkennung, manifest.json-Validierung, Clean-Core-Pr\u00fcfungen wie DML auf SAP-Tabellen oder Upgrade-Sicherheit von BDEF-Erweiterungen, und Konsistenzpr\u00fcfungen \u00fcber mehrere Artefakte hinweg.
toolkit.codeReview.benefit=Findet, was der UI5-Linter nicht sieht \u2014 besonders die artefakt\u00fcbergreifenden Br\u00fcche zwischen CDS, BDEF und UI. Jeder Fund kommt mit Regel-ID, Schweregrad und konkretem L\u00f6sungsvorschlag, ist also diskutierbar statt nur behauptet.
toolkit.rapGenerator.function=Erzeugt aus einer fachlichen Zielbeschreibung vollst\u00e4ndige Entwicklungsskelette: CDS Views, Behavior Definitions mit Determinations und Validations, Service Definitions, Fiori-Elements-Konfiguration \u00fcber sechs Floorplans sowie UI5-TypeScript-Freestyle-Scaffolds.
toolkit.rapGenerator.benefit=Der immer gleiche Teil eines RAP/Fiori-Projekts entsteht in Sekunden statt in Tagen \u2014 einheitlich benannt und annotiert. Die gesparte Zeit flie\u00dft in die Fachlogik, nicht in Boilerplate.
toolkit.ticketAnalysis.function=Nimmt unstrukturierten Tickettext auf Deutsch oder Englisch und erzeugt ein zehnteiliges technisches Assessment: Anforderungstyp (10 Typen, 28 Subtypen), offene R\u00fcckfragen, L\u00f6sungsoptionen aus \u00fcber 60 Vorlagen, Impact-Mapping, Aufwandsch\u00e4tzung, Risiken, Umsetzungsplan und Testsicht \u2014 dazu eine kundentaugliche Fassung. Zehn Dom\u00e4nen-Packs, darunter EWM, Yard Logistics, Service, MII/MES und FI/CO.
toolkit.ticketAnalysis.benefit=Aus \u201eder Kunde will irgendwas mit Lieferungen\u201c wird eine belastbare Aufwandsaussage mit benannten Annahmen. Die Kundenfassung erspart die zweite \u00dcbersetzungsrunde ins Fachliche.
toolkit.jouleEnablement.function=Erzeugt aus einem Joule-Use-Case und der bestehenden On-Premise-Landschaft einen Enablement-Blueprint: Zielbetriebsmodell samt UX-Muster, IAS/IPS-Identity, Cloud-Connector- und Destination-Design, Joule-Studio-Skills und -Agenten, Governance und AI-Unit-Absch\u00e4tzung \u2014 plus Starter-Scaffolds und den Alternativpfad \u00fcber SAP AI Core beziehungsweise das ABAP AI SDK.
toolkit.jouleEnablement.benefit=Beantwortet die Frage, die in jedem Joule-Vorgespr\u00e4ch kommt: Was genau m\u00fcssen wir tun, damit das in unserer Landschaft l\u00e4uft? Als pr\u00fcfbarer Blueprint statt als Foliensatz \u2014 jede tragende Aussage ist gegen die SAP-Prim\u00e4rdokumentation abgeglichen.
toolkit.riseReadiness.title=Joule f\u00fcr RISE
toolkit.riseReadiness.description=Embedded Readiness Accelerator. Pr\u00fcft eine S/4HANA-Cloud-Private-Edition-Landschaft (RISE) darauf, ob embedded Joule aktiviert werden kann \u2014 Readiness-Gap-Analyse, Aktivierungs-Runbook und ausf\u00fcllbare Aktivierungsartefakte.
toolkit.riseReadiness.function=Nimmt den beschriebenen Ist-Zustand einer RISE-Landschaft und pr\u00fcft ihn je Joule-F\u00e4higkeit \u2014 navigational, informational, transaktional, analytisch \u2014 gegen einen Katalog dokumentierter Voraussetzungen. Ergebnis: L\u00fcckenliste, geordnetes Aktivierungs-Runbook und vorbereitete Artefakte als JSON und Markdown.
toolkit.riseReadiness.benefit=Kl\u00e4rt vor dem Projekt, was RISE-Kunden sonst im Projekt herausfinden: Welche Voraussetzung fehlt noch, und in welcher Reihenfolge wird freigeschaltet? Das Schwesterst\u00fcck zum On-Premise-Accelerator \u2014 dort geht es darum, Joule \u00fcberhaupt zu erreichen, hier um die Freischaltung des eingebetteten Joule.

# Built with AI
