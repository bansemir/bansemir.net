positioning.delivery.text=Anforderungsanalyse, L\u00f6sungs- und Technikkonzepte, Entwicklung und fachliche Begleitung im Team \u2014 inklusive Kundenworkshops und Go-Live-Betreuung. Enablement inklusive: Ihr Team setzt AI-Tools und strukturierte Methoden danach selbst ein.
positioning.sapDepth.title=SAP-Tiefe
positioning.sapDepth.text=12+ Jahre SAP Fiori, ABAP, BTP, MII/MES \u2014 u.a. f\u00fcr Schwarz IT/Lidl, Zeppelin und ARYZTA. Funktionaler Schwerpunkt: Produktion (PP, PM), Logistik (WM, eWM, YL), Serviceprozesse (CS). Von Custom ABAP bis Clean Core, von Shopfloor bis Boardroom.
positioning.archBreadth.title=Architektur-Breite
positioning.archBreadth.text=Seit 2002 in der IT: 20+ Jahre Softwarearchitektur in 4 Branchen \u2014 Versicherung, Logistik, Lebensmittelproduktion, Bauindustrie. Davon 12 Jahre au\u00dferhalb der SAP-Welt (Java EE, WebSphere): L\u00f6sungsans\u00e4tze jenseits des Standard-SAP-Wegs. Diplom-Informatiker (KI) \u2014 FAU Erlangen-N\u00fcrnberg.
positioning.aiPractice.title=AI in der Praxis
positioning.aiPractice.text=Eigenes regelbasiertes Accelerator-Toolkit mit 170.000 Zeilen Code und 250+ SAP-Pr\u00fcfregeln. Claude Code als t\u00e4gliches Werkzeug. Kein LLM zur Laufzeit, keine externen Aufrufe \u2014 weder Code noch Fachdaten verlassen Ihre Umgebung. Keine Theorie \u2014 messbare Ergebnisse.

