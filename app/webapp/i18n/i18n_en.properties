# Positioning
positioning.heading=What sets me apart
positioning.delivery.title=From requirement to go-live
positioning.delivery.text=Requirements analysis, solution and technical design, hands-on development and technical guidance within the team \u2014 including customer workshops and go-live support. Enablement included: your team applies AI tools and structured methods on its own afterwards.
positioning.sapDepth.title=SAP depth
positioning.sapDepth.text=12+ years SAP Fiori, ABAP, BTP, MII/MES \u2014 for clients including Schwarz IT/Lidl, Zeppelin and ARYZTA. Functional focus: production (PP, PM), logistics (WM, eWM, YL), service processes (CS). From custom ABAP to Clean Core, from shopfloor to boardroom.
positioning.archBreadth.title=Architecture breadth
positioning.archBreadth.text=In IT since 2002: 20+ years of software architecture across 4 industries \u2014 insurance, logistics, food production, and construction. Twelve of those years outside the SAP world (Java EE, WebSphere): approaches beyond the standard SAP way. Diplom-Informatiker (AI) \u2014 FAU Erlangen-N\u00fcrnberg.
positioning.aiPractice.title=AI in practice
positioning.aiPractice.text=Custom-built rule-based Accelerator Toolkit with 170,000 lines of code and 250+ SAP validation rules. Claude Code as a daily tool. No LLM at runtime, no external calls \u2014 neither your code nor your business data leaves your environment. Not theory \u2014 measurable results.

