# Toolkit
toolkit.heading=SAP Accelerator Toolkit
toolkit.subline=Six specialized applications. Rule-based, deterministic, no AI wrapper.
toolkit.stats.lines=170,000+ lines of code
toolkit.stats.rules=250+ validation rules
toolkit.stats.tests=5,500+ tests
toolkit.stats.domains=10 SAP domains
toolkit.fieldChange.title=Field-change analysis
toolkit.fieldChange.description=Automated requirements analysis based on field definitions and change history.
toolkit.codeReview.title=Code review
toolkit.codeReview.description=Static analysis with 250+ SAP-specific validation rules for ABAP, CDS, and Fiori.
toolkit.rapGenerator.title=RAP/Fiori generator
toolkit.rapGenerator.description=Skeleton generation for RAP Business Objects and Fiori Elements apps from functional specs.
toolkit.ticketAnalysis.title=Ticket evaluation
toolkit.ticketAnalysis.description=Score-based classification of requirement tickets by effort, risk, and feasibility.
toolkit.jouleEnablement.title=SAP Joule & BTP AI enablement
toolkit.jouleEnablement.description=Turns a Joule use case and an existing on-premise landscape into a complete enablement blueprint: target operating model, IAS/IPS identity, cloud connector and destination design, Joule Studio skills, governance and AI unit estimation.
toolkit.result=Based on experience: approx. 30\u201350% faster development cycles with higher quality.
toolkit.cta=Interested? Let's talk.
toolkit.comingSoon=Coming soon: Try the code review yourself.
toolkit.concept.title=Why rule-based instead of just an LLM
toolkit.concept.text=<p>Most AI tools for SAP are LLM wrappers: prompt in, answer out. That breaks down the moment traceability matters \u2014 the same input yields a different result on the second run, and nobody can explain why.</p><p>This toolkit inverts that. Every application runs on static SAP domain rules and score-based classification. Same input, same result, reproducible at any time. No LLM at runtime, no external calls \u2014 neither code nor business data leaves your environment. That is the difference between a tool you can use on a client project and one you can only demo.</p>
toolkit.architecture.title=How it works
toolkit.architecture.text=<p>All six applications share the same architecture: a <strong>rule layer</strong> of versioned SAP domain rules, each with an ID, a severity and a rationale; an <strong>engine layer</strong> that classifies, scores and checks input against those rules; and a <strong>formatter layer</strong> that produces structured JSON and readable Markdown.</p><p>Wherever it can be substantiated, a rule carries its reference to the SAP documentation. What the tool claims can be looked up. The test suites hold that together \u2014 every domain rule is backed by several test cases. Python and FastAPI, each app runs standalone, database optional.</p>
toolkit.labelFunction=What it does
toolkit.labelBenefit=Benefit
toolkit.fieldChange.function=Takes a field request such as \u201cadd field X to app Y\u201d and turns it into a technical solution draft: change-type classification (13 types), impact analysis across nine SAP layers from table through CDS, BOPF/RAP and OData up to the UI, plus risk assessment and test cases.
toolkit.fieldChange.benefit=The question \u201cwhat else does this touch?\u201d is no longer answered from memory. Instead of writing a draft you review one \u2014 and immediately see the layer you would otherwise have missed.
toolkit.codeReview.function=Automated review for ABAP, CDS views, RAP behavior definitions, UI5 XML views and controllers. Over 250 rules across 21 modules: deprecation detection, manifest.json validation, clean-core checks such as DML on SAP tables or upgrade safety of BDEF extensions, and consistency checks spanning multiple artifacts.
toolkit.codeReview.benefit=Finds what the UI5 linter cannot see \u2014 especially the cross-artifact breaks between CDS, BDEF and UI. Every finding carries a rule ID, a severity and a concrete fix, so it can be argued with rather than merely asserted.
toolkit.rapGenerator.function=Generates complete development skeletons from a business goal description: CDS views, behavior definitions with determinations and validations, service definitions, Fiori Elements configuration across six floorplans, and UI5 TypeScript freestyle scaffolds.
toolkit.rapGenerator.benefit=The part of a RAP/Fiori project that is always the same takes seconds instead of days \u2014 consistently named and annotated. The time saved goes into business logic, not boilerplate.
toolkit.ticketAnalysis.function=Takes unstructured ticket text in German or English and produces a ten-part technical assessment: request type (10 types, 28 subtypes), open clarifications, solution options from over 60 templates, impact mapping, effort estimate, risks, implementation plan and test view \u2014 plus a customer-facing version. Ten domain packs, including EWM, yard logistics, service, MII/MES and FI/CO.
toolkit.ticketAnalysis.benefit=Turns \u201cthe customer wants something with deliveries\u201d into a defensible effort statement with its assumptions spelled out. The customer-facing version saves the second round of translation.
toolkit.jouleEnablement.function=Turns a Joule use case and an existing on-premise landscape into an enablement blueprint: target operating model including UX pattern, IAS/IPS identity, cloud connector and destination design, Joule Studio skills and agents, governance and AI unit estimation \u2014 plus starter scaffolds and the alternative track via SAP AI Core or the ABAP AI SDK.
toolkit.jouleEnablement.benefit=Answers the question that comes up in every Joule pre-sales conversation: what exactly do we have to do to make this run in our landscape? As a verifiable blueprint rather than a slide deck \u2014 every load-bearing statement reconciled against SAP primary documentation.
toolkit.riseReadiness.title=Joule for RISE
toolkit.riseReadiness.description=Embedded readiness accelerator. Checks an S/4HANA Cloud Private Edition (RISE) landscape for embedded Joule readiness \u2014 gap analysis, activation runbook and fillable activation artifacts.
toolkit.riseReadiness.function=Takes the described current state of a RISE landscape and checks it per Joule capability \u2014 navigational, informational, transactional, analytical \u2014 against a catalogue of documented prerequisites. Output: a gap list, an ordered activation runbook and prepared artifacts as JSON and Markdown.
toolkit.riseReadiness.benefit=Settles before the project what RISE customers otherwise discover during it: which prerequisite is still missing, and in what order to switch things on. The sibling to the on-premise accelerator \u2014 that one is about reaching Joule at all, this one about enabling embedded Joule.

